name: cinemapedia
description: "CinePedia - Aplicación de cine en Flutter."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  animate_do: ^3.3.4
  audioplayers: ^6.8.1
  card_swiper: ^3.0.1
  dio: ^5.7.0
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.5.1
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^14.3.2
  intl: ^0.19.0
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: 3.1.0+1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo.jpg
    - assets/images/christmas_logo.jpg
    - assets/images/cinema_world_day_logo.jpg
    - assets/images/aniversary_logo.jpg
    - assets/images/halloween_logo.jpg
    - assets/images/valentine_logo.jpg
    - assets/sounds/
