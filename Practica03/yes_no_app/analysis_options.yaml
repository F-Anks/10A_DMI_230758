# Configuración personalizada del analizador estático de Dart para el proyecto Yes No App
# Este archivo ayuda a mantener un código limpio, estructurado y libre de errores.
# Para verificar el código manualmente, se puede ejecutar `flutter analyze` en la terminal.

include: package:flutter_lints/flutter.yaml

analyzer:
  # Excluir archivos autogenerados y carpetas de plataforma para agilizar el análisis
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/**/*.g.dart

linter:
  # Reglas de linting personalizadas para esta práctica
  # Se activan buenas prácticas específicas para mejorar la calidad del código
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    use_key_in_widget_constructors: true
    avoid_print: true # Fomentar el uso de debugPrint o un logger en lugar de print()
    prefer_single_quotes: true
    avoid_empty_else: true
    cancel_subscriptions: true
