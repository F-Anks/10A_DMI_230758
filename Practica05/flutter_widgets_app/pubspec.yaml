name: flutter_widgets_app
description: "Ridgets App - Catálogo interactivo de Widgets en Flutter con Material 3 y Riverpod."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.0.2
  flutter_riverpod: ^3.4.3
  animate_do: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.jpg"
  windows:
    generate: true
    image_path: "assets/images/logo.jpg"
